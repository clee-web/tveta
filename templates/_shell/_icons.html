{#- Inline SVG icon set. Emoji are used elsewhere in this project but render as
    broken glyphs on Windows without an emoji font, so the admin shell uses these. -#}

{% macro svg(name, cls='') -%}
<svg class="ic {{ cls }}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {%- if name == 'gauge' -%}
    <path d="M12 20a8 8 0 1 0-8-8" /><path d="M12 12l4-3" /><circle cx="12" cy="12" r="1.4" />
    {%- elif name == 'inbox' -%}
    <path d="M3 12h5l1.5 3h5L16 12h5" />
    <path d="M5.5 5h13l2.5 7v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z" />
    {%- elif name == 'users' -%}
    <circle cx="9" cy="8" r="3.2" /><path d="M3.5 20a5.5 5.5 0 0 1 11 0" />
    <path d="M16 5.3a3.2 3.2 0 0 1 0 5.4" /><path d="M17.2 14.6A5.5 5.5 0 0 1 20.5 20" />
    {%- elif name == 'wallet' -%}
    <rect x="3" y="6" width="18" height="13" rx="2.5" /><path d="M3 10.5h18" />
    <circle cx="16.5" cy="15" r="1.2" />
    {%- elif name == 'teacher' -%}
    <circle cx="12" cy="7.5" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" />
    {%- elif name == 'building' -%}
    <rect x="4" y="3" width="16" height="18" rx="1.5" /><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2" />
    <path d="M10 21v-3h4v3" />
    {%- elif name == 'book' -%}
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
    {%- elif name == 'globe' -%}
    <circle cx="12" cy="12" r="9" /><path d="M3 12h18" />
    <path d="M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18" />
    {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.4-4.4" />
    {%- elif name == 'download' -%}
    <path d="M12 4v10M8 11l4 4 4-4" /><path d="M5 19h14" />
    {%- elif name == 'bell' -%}
    <path d="M18 8.5a6 6 0 1 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5" />
    <path d="M10.5 19a2 2 0 0 0 3 0" />
    {%- elif name == 'sun' -%}
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.2 4.2l1.5 1.5M18.3 18.3l1.5 1.5M2 12h2M20 12h2M4.2 19.8l1.5-1.5M18.3 5.7l1.5-1.5" />
    {%- elif name == 'moon' -%}
    <path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z" />
    {%- elif name == 'menu' -%}
    <path d="M4 7h16M4 12h16M4 17h16" />
    {%- elif name == 'close' -%}
    <path d="M6 6l12 12M18 6L6 18" />
    {%- elif name == 'check' -%}
    <path d="M4.5 12.5l5 5L20 7" />
    {%- elif name == 'check-circle' -%}
    <circle cx="12" cy="12" r="9" /><path d="M8 12.2l2.8 2.8L16.2 9.6" />
    {%- elif name == 'plus' -%}
    <path d="M12 5v14M5 12h14" />
    {%- elif name == 'chevron-down' -%}
    <path d="M6 9.5l6 6 6-6" />
    {%- elif name == 'arrow-right' -%}
    <path d="M5 12h13M13 6.5l5.5 5.5L13 17.5" />
    {%- elif name == 'arrow-left' -%}
    <path d="M19 12H6M11 6.5L5.5 12 11 17.5" />
    {%- elif name == 'trend' -%}
    <path d="M3.5 16.5l5-5 3.5 3.5L20 7.5" /><path d="M15 7.5h5v5" />
    {%- elif name == 'alert' -%}
    <path d="M10.3 3.9L2.5 17.4A2 2 0 0 0 4.2 20.4h15.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" />
    <path d="M12 9.5v4M12 16.8v.2" />
    {%- elif name == 'trash' -%}
    <path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13" />
    {%- elif name == 'edit' -%}
    <path d="M13.5 6.5l4 4L8 20H4v-4z" /><path d="M15.5 4.5l2-2 4 4-2 2" />
    {%- elif name == 'eye' -%}
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z" />
    <circle cx="12" cy="12" r="2.8" />
    {%- elif name == 'clock' -%}
    <circle cx="12" cy="12" r="9" /><path d="M12 7.5V12l3.5 2" />
    {%- elif name == 'logout' -%}
    <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3" /><path d="M10 8l-4 4 4 4" /><path d="M6 12h9" />
    {%- elif name == 'filter' -%}
    <path d="M4 6h16M7 12h10M10 18h4" />
    {%- elif name == 'chart' -%}
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" />
    {%- elif name == 'cap' -%}
    <path d="M2.5 9L12 4.5 21.5 9 12 13.5z" /><path d="M6.5 11v4.5c0 1.4 2.5 2.5 5.5 2.5s5.5-1.1 5.5-2.5V11" />
    {%- elif name == 'qr' -%}
    <path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4z" />
    <path d="M14 14h2.5v2.5H14zM17.5 17.5H20v2.5h-2.5zM14 20h2.5M20 14v2" />
    {%- endif -%}
</svg>
{%- endmacro %}
