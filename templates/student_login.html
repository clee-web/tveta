{% extends "base.html" %}
{% block title %}Student Portal — AMUAA{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="login-brand">
            <img class="login-logo" src="{{ url_for('public.assets', filename='AMUAA-IPS-LOGO-2026.png') }}" alt="AMUAA logo">
            <div>
                <h1>Student Portal</h1>
                <p class="subtitle">AMUAA Institute</p>
            </div>
        </div>

        <form method="POST" action="{{ url_for('student.login') }}">
            <div class="form-group">
                <label for="admission_number">Admission number</label>
                <input id="admission_number" name="admission_number" type="text"
                    placeholder="e.g. AMUAA/ICT/2026/001" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Enter your password" required
                    autocomplete="current-password">
            </div>
            <button class="btn-primary" type="submit">Sign In</button>
        </form>

        <p class="login-footer">
            <a href="{{ url_for('public.index') }}">← Back to public site</a>
        </p>
    </div>
</div>
{% endblock %}
